/* ==== p02_l1.js ==== */
/* Level grids are built from rect fills + stamps so tile widths can never
   drift out of sync. buildGrid returns an array of equal-width row strings. */
function buildGrid(W, H, ops) {
  const g = []; for (let y = 0; y < H; y++) g.push(new Array(W).fill('.'));
  const rect = (x0, x1, y0, y1, ch) => {
    for (let y = Math.max(0, y0); y <= Math.min(H - 1, y1); y++)
      for (let x = Math.max(0, x0); x <= Math.min(W - 1, x0 >= 0 ? Math.min(x1, W - 1) : 0); x++) g[y][x] = ch;
  };
  const at = (x, y, ch) => { if (y >= 0 && y < H && x >= 0 && x < W) g[y][x] = ch; };
  const run = (x0, y, ch, n) => { for (let i = 0; i < n; i++) at(x0 + i, y, ch); };
  ops({ rect, at, run, W, H });
  return g.map(r => r.join(''));
}

const midi = s => { const m = /^([a-g])(#?)(\d)$/.exec(s); if (!m) return null;
  const n = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 }; return 12 * (+m[3] + 1) + n[m[1]] + (m[2] ? 1 : 0); };

      this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value = 0.85; this.sfxBus.connect(this.master);
      // simple feedback delay send, used for shimmer on leads & bells

      const fb = this.ctx.createGain(); fb.gain.value = 0.34;

      const n = this.ctx.sampleRate | 0, buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf; this.ok = true;

    if (o.det) osc.detune.value = o.det;

    if (o.mf) { const f = c.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(o.mf, t); if (o.mq) f.Q.value = o.mq; node.connect(f); node = f; }
    const at = o.at || 0.005, dl = o.dl || (o.d || 0.15);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(o.v == null ? 0.3 : o.v, t + at);
    g.gain.exponentialRampToValueAtTime(0.0001, t + at + dl);
    node.connect(g); g.connect(o.to || this.sfxBus);

    osc.start(t); osc.stop(t + at + dl + 0.02);

  noise(o) {                                  // o: d,v,f,f2,type,when,q,to,rate

    if (o.f2) f.frequency.exponentialRampToValueAtTime(Math.max(40, o.f2), t + (o.d || 0.12));
    f.Q.value = o.q == null ? 1.2 : o.q;

    g.gain.setValueAtTime(Math.max(0.0002, o.v == null ? 0.25 : o.v), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (o.d || 0.12));

    this.mus.gain.cancelScheduledValues(t0); this.mus.gain.setValueAtTime(this.mus.gain.value, t0);

  g.lineTo(L + w, Tp + h - r); g.quadraticCurveTo(L + w + wob(2) * 0.6, Tp + h, L + w - r, Tp + h);
  g.lineTo(L + r, Tp + h); g.quadraticCurveTo(L, Tp + h + wob(3) * 0.5, L, Tp + h - r);
  g.lineTo(L, Tp + r); g.quadraticCurveTo(L - wob(4) * 0.5, Tp, L + r, Tp);

const PT = {
  pool: [], MAX: 340,
  add(o) { if (this.pool.length >= this.MAX) this.pool.shift();
    o.t = 0; o.life = o.life || 40; o.g = o.g == null ? 0.08 : o.g; o.sz = o.sz || 2;
    this.pool.push(o); },
  burst(x, y, n, o) { for (let i = 0; i < n; i++) {
    const a = o.a == null ? Math.random() * TAU : o.a + rnd(-0.6, 0.6), sp = rnd(o.sp0 || 0.4, o.sp1 || 2.2);
    this.add({ x, y, vx: Math.cos(a) * sp + (o.vx || 0), vy: Math.sin(a) * sp + (o.vy || 0),
      g: o.g, col: Array.isArray(o.col) ? o.col[i % o.col.length] : o.col, sz: o.sz || 2,
      life: (o.life || 30) + (Math.random() * 10 | 0), type: o.type || 'sq', rot: Math.random() * TAU, vr: rnd(-0.2, 0.2) }); } },
  update() { const p = this.pool;
    for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; q.t++;
      if (q.type === 'smoke') { q.vy -= 0.006; q.vx *= 0.98; }
      if (q.type === 'conf') { q.vy += 0.02; q.vx += Math.sin((q.t + q.rot * 10) * 0.08) * 0.05; }
      q.vy += q.g; q.x += q.vx; q.y += q.vy;
      if (q.vr) q.rot += q.vr;
      if (q.type === 'bounce' && q.vy > 0 && tileAtPx(q.x, q.y + 2) !== '.') { q.vy = -Math.abs(q.vy) * 0.4; q.vx *= 0.6; }
      if (q.t >= q.life) p.splice(i, 1); } },
  draw(g, cam) { const p = this.pool;
    for (let i = 0; i < p.length; i++) { const q = p[i]; const a = 1 - q.t / q.life;
      g.globalAlpha = clamp(a, 0, 1); g.fillStyle = q.col;
      const x = (q.x - cam.x) | 0, y = (q.y - cam.y) | 0;
      if (x < -8 || y < -8 || x > VW + 8 || y > VH + 8) continue;
      if (q.type === 'line') { g.fillRect(x, y, Math.max(1, q.vx * 2 | 0), Math.max(1, q.sz)); }

};

/* ======================================================= TILE HELPERS ==== */
let L = null;                                   // active runtime level
/* Out of bounds is solid (walls, ceiling) EXCEPT below the level, which is the
   void: falling into a pit must fall forever and cost Slopio a hit. */
function tileAtPx(px, py) {
  if (!L) return '#';
  const tx = Math.floor(px / TS), ty = Math.floor(py / TS);
  if (ty >= L.h) return '.';
  if (tx < 0 || ty < 0 || tx >= L.w) return '#';
  return L.grid[ty][tx];
}
function tileAt(tx, ty) { if (!L) return '#'; if (tx < 0 || ty < 0 || tx >= L.w || ty >= L.h) return '#'; return L.grid[ty][tx]; }
function setTile(tx, ty, ch) { if (L && ty >= 0 && ty < L.h && tx >= 0 && tx < L.w) L.grid[ty][tx] = ch; }

function bodyHit(b) { return solidPx(b.x - b.w / 2 + 1, b.y - b.h / 2) || solidPx(b.x + b.w / 2 - 1, b.y - b.h / 2) || solidPx(b.x, b.y - b.h + 2) || solidPx(b.x, b.y - 2); }

/* Generic AABB tile mover. b.x,b.y = feet-centre. */
function moveBody(b, opts) {
  opts = opts || {};
  b.onGround = false; b.onIce = false; b.conv = 0;
  const pts = [-b.w / 2 + 2, b.w / 2 - 2];
  /* ---- X ---- */
  if (b.vx) {
    const dir = b.vx > 0 ? 1 : -1, side = b.x + b.vx + dir * b.w / 2;
    const ys = [b.y - b.h + 3, b.y - b.h / 2, b.y - 2];
    let blocked = false;
    for (const yy of ys) if (solidPx(side, yy)) { blocked = true; break; }
    if (blocked) {
      b.x = dir > 0 ? Math.floor(side / TS) * TS - b.w / 2 - 0.01 : (Math.floor(side / TS) + 1) * TS + b.w / 2 + 0.01;
      b.hitWall = true; b.vx = 0;
    } else b.x += b.vx;
  }
  /* ---- Y ---- */
  const prevBottom = b.y;
  if (b.vy > 0) {
    const bottom = b.y + b.vy, row = Math.floor(bottom / TS);
    let landed = false, landY = null;
    for (const off of pts) {
      const t = tileAtPx(b.x + off, bottom);
      if (T_SOLID.has(t)) { landed = true; landY = row * TS; break; }
      if (T_ONEWAY.has(t) && !opts.ignoreOneway && prevBottom <= row * TS + 1.5) { landed = true; landY = row * TS; }
    }
    if (landed) { b.y = landY; b.vy = 0; b.onGround = true; }
    else b.y = bottom;
  } else if (b.vy < 0) {
    const top = b.y + b.vy - b.h, row = Math.floor(top / TS);
    let bonk = false;
    for (const off of pts) {
      const t = tileAtPx(b.x + off, top);
      /* brittle decks also break from below, so a smashed secret can never
         become a trap: you can always punch your way back out */
      if (t === 'B' && opts.breakBrittle) { smashTile(Math.floor((b.x + off) / TS), row); continue; }
      if (T_SOLID.has(t)) { bonk = true; break; }
    }
    if (bonk) { b.y = (row + 1) * TS + b.h; b.vy = 0; b.hitCeil = true; }
    else b.y += b.vy;
  }
  if (b.onGround) {
    for (const off of pts) { const t = tileAtPx(b.x + off, b.y + 1);
      if (T_SLIP.has(t)) b.onIce = true; if (t === '>') b.conv = 1; if (t === '<') b.conv = -1; }
  }
  b.inLiquid = false;
  for (const yy of [b.y - b.h * 0.6, b.y - 1]) if (T_LIQUID.has(tileAtPx(b.x, yy))) b.inLiquid = true;
}

    else if (c === 'b') { mkEnt('pad', x, y - 4, { w: 16, h: 8 }); setTile(tx, ty, '.'); }
    else if (c === 'j') { const p = mkEnt('piston', x, y, { w: 16, h: 34, cycle: 90 + (tx * 37 % 60), phase: (tx * 53) % 150, floorY: y }); L.pistons.push(p); setTile(tx, ty, '.'); }
    else if (c === 'Z') { mkEnt('saw', x, y - 2, { w: 16, h: 16, r: 8, baseX: x, range: 40 + (tx % 5) * 14, sp: 0.012 + (tx % 3) * 0.004 }); setTile(tx, ty, '.'); }
    else if (c === 't') { const r = mkEnt('relay', x, y - 8, { w: 14, h: 14, on: false }); L.relays.push(r); setTile(tx, ty, '.'); }
    else if (c === 'M') { const b = mkEnt('bell', x, y - 8, { w: 14, h: 14, rang: false }); L.bells.push(b); setTile(tx, ty, '.'); }
    else if (c === '*') { mkEnt('torch', x, y - 6, { w: 10, h: 12 }); setTile(tx, ty, '.'); }
    else if (c === 'D') { mkEnt('drip', x, y, { w: 4, h: 4, every: 90 + (tx * 29 % 120) }); setTile(tx, ty, '.'); }
    else if (c === 'd') { mkEnt('prop_vine', x, y - 6, { w: 8, h: 26, len: 16 + (tx % 3) * 8 }); setTile(tx, ty, '.'); }
    else if (c === '|') { L.fans.push({ x0: tx * TS, x1: tx * TS + TS, y0: ty * TS + TS, col: tx }); setTile(tx, ty, '.'); }
    else if (c === 'n') { mkEnt('vine', x, y - 2, { w: 10, h: 26, baseY: y }); setTile(tx, ty, '.'); }

}

/* how many of Slopio's own globs are in the air — that is the fire-rate limiter

function updatePlayer() {
  const P = Pl;
  if (P.dead) {                                   // death animation
    P.vy = Math.min(MAXFALL, P.vy + GRAV * 0.7); P.y += P.vy; P.deadT++;
    if (P.deadT % 12 === 0) PT.add({ x: P.x + rnd(-6, 6), y: P.y - 6, vx: rnd(-1, 1), vy: rnd(-1.6, -0.4), col: '#4fd6a6', life: 40, sz: 3, g: 0.06 });
    if (P.deadT > 70) State.set('gameover');

  const top = RUN * (heavy ? 0.92 : 1);
  let mv = 0;
  if (L_()) mv -= 1; if (R_()) mv += 1;
  if (mv) { P.vx += accel * mv; P.face = mv;
    if (Math.abs(P.vx) > top) P.vx = top * Math.sign(P.vx);
  } else {
    const fr = (P.onGround ? (ice ? FRIC_GND * 0.22 : FRIC_GND) : FRIC_AIR) * (P.inLiquid ? 2.4 : 1);
    P.vx -= clamp(P.vx, -fr, fr);

  if (P.jbuf > 0) P.jbuf--;

function updateProj() {

        setTile(tx, ty, 'I'); L.frostIce = (L.frostIce || []); L.frostIce.push([tx, ty]); S.freeze();
        PT.burst(tx * TS + 8, ty * TS + 8, 10, { col: ['#d8f6ff', '#8fdcff'], sp1: 2, life: 26, g: 0.04 }); }
      else if (p.el === 'ember') { PT.burst(p.x, p.y, 8, { col: ['#ffd15c', '#ff8a3d'], sp1: 1.6, life: 20, g: -0.02 }); }
      else PT.burst(p.x, p.y, 5, { col: G.lite, sp1: 1.4, life: 16, g: 0.05 });

      /* a glob lands on the floor and skids once, so ground-level shots still
         reach things just over the lip of a step */
      if (p.bounce < 1 && p.vy > 0.8 && tileAtPx(p.x, p.y - 8) === '.') {
        p.bounce++; p.vy = -p.vy * 0.45; p.vx *= 0.66; p.y -= 3;
        PT.burst(p.x, p.y + 4, 4, { col: G.lite, sp1: 1.2, life: 14, g: 0.08 });
      } else hit = true;
    }
    for (const e of Ents) {
      if (e.dead) continue;
      if (e.type === 'crate') { if (Math.abs(e.x - p.x) < 9 && Math.abs(e.y - p.y) < 9) {
        e.dead = true; S.smash(); PT.burst(e.x, e.y, 16, { col: ['#a87438', '#d9a862', '#7a5228'], sp1: 2.6, life: 36, g: 0.2, sz: 2 }); hit = true; } continue; }
      if (e.type === 'relay') { if (!e.on && Math.abs(e.x - p.x) < 12 && Math.abs(e.y - p.y) < 12) { e.on = true; fireRelay(); hit = true; } continue; }
      if (e.type === 'bell') { if (!e.rang && Math.abs(e.x - p.x) < 12 && Math.abs(e.y - p.y) < 14) { e.rang = true; ringBell(e); hit = true; } continue; }
      if (e.type !== 'enemy' || !e.killable) continue;
      if (Math.abs(e.x - p.x) < e.w / 2 + 5 && Math.abs((e.y - e.h / 2) - p.y) < e.h / 2 + 5) {
        hit = true;
        if (p.el === 'frost') { if (e.frozen <= 0) { e.frozen = 300; S.freeze();
            PT.burst(e.x, e.y - e.h / 2, 12, { col: ['#d8f6ff', '#8fdcff', '#ffffff'], sp1: 2, life: 26, g: 0.05 }); }
          else killEnemy(e, 'frost'); }
        else { e.hp -= p.dmg; e.flash = 6;
          if (e.hp <= 0) killEnemy(e, p.el); else { S.clank(); e.vx = Math.sign(p.vx) * 1.2; } }
        break;
      }
    }
    if (boss && boss.alive && !boss.intro && projHitsBoss(p)) { hit = true; }
    if (p.el === 'charge') for (const e of Ents) if (e.type === 'enemy' && e.kind === 'hound' && !e.dead && Math.abs(e.x - p.x) < 30) e.stun = 30;
    if (hit || p.life <= 0 || p.x < -20 || p.x > L.w * TS + 20 || p.y > L.h * TS + 40) {
      if (hit) PT.burst(p.x, p.y, 10, { col: [G.col, G.lite, '#ffffff'], sp1: 2.4, life: 22, g: 0.08 });
      Proj.splice(i, 1);
    }
  }
}
function fireRelay() {
  S.clank(); Cam.shake = 4;
  if (!L.shutterOpen) { L.shutterOpen = true;
    for (let ty = 0; ty < L.h; ty++) for (let tx = 0; tx < L.w; tx++) if (tileAt(tx, ty) === 'T') {
      setTile(tx, ty, '.');
      PT.burst(tx * TS + 8, ty * TS + 8, 6, { col: ['#8a8a9c', '#ffe14f'], sp1: 2, life: 26, g: 0.2 }); }
    S.smash();
  }
}
function ringBell(e) {
  S.bell(); e.t = 0;
  PT.burst(e.x, e.y, 14, { col: ['#8fdcff', '#ffffff'], sp1: 2, life: 40, g: -0.01, sz: 2 });
  PT.add({ x: e.x, y: e.y, col: 'rgba(180,235,255,0.8)', life: 26, sz: 0, type: 'ring', r0: 4, rv: 1.8, g: 0 });
  L.bellsRang = (L.bellsRang || 0) + 1;
  if (L.bells.length && L.bellsRang >= L.bells.length) {
    L.secretFound = true; S.chime();
    PT.burst(Pl.x, Pl.y - 10, 30, { col: ['#ffe14f', '#8fdcff', '#ffffff'], sp1: 3.4, life: 60, g: 0.02, type: 'conf' });
  }
}

/* ==== p10_ents.js ==== */
/* ========================================================== RUN STATE ==== */
const Run = { level: 0, shards: 0, total: 0, time: 0, deaths: 0, kills: 0, best: null, overclock: false };
try { const s = JSON.parse(localStorage.getItem('slopio') || '{}');
  Run.best = s.best || null; Run.overclock = !!s.oc; } catch (e) { }
function saveRun() { try {
  const s = { best: Run.best, oc: Run.overclock }; localStorage.setItem('slopio', JSON.stringify(s)); } catch (e) { } }

/* ============================================================ ENTITIES === */
const VIEW_PAD = 40;
const inView = e => e.x > Cam.x - VIEW_PAD && e.x < Cam.x + VW + VIEW_PAD && e.y > Cam.y - VIEW_PAD && e.y < Cam.y + VH + VIEW_PAD;
const plFeetY = () => Pl.y, plCX = () => Pl.x;

function updateEnts() {
  L.t++;
  /* air jets: every vent column blows on its own staggered cycle */
  for (const f of L.fans) {
    f.cyc = (L.t + f.phase) % f.period;
    f.on = f.cyc > 58 && f.cyc < 58 + f.len;
    f.gustTop = f.y0 - f.reach;
    if (f.on && L.t % 3 === 0) PT.add({ x: rnd(f.x0, f.x1), y: f.y0 - 2, vx: rnd(-0.4, 0.4), vy: rnd(-3.6, -2.4),
      col: 'rgba(190,220,255,0.5)', life: 44, sz: 2, g: -0.012 });
    if (f.on && L.t % 30 === 0) S.gust();
  }
  L.fanOn = L.fans.some(f => f.on);
  /* frost platforms melt back */
  if (L.frostIce && L.t % 30 === 0) { const a = L.frostIce;
    if (a.length > 6) { const [tx, ty] = a.shift(); if (tileAt(tx, ty) === 'I') { setTile(tx, ty, '~');
      PT.burst(tx * TS + 8, ty * TS + 8, 6, { col: '#8fdcff', sp1: 1.4, life: 20, g: 0.05 }); } } }

  for (let i = Ents.length - 1; i >= 0; i--) {
    const e = Ents[i];
    if (e.dead) { Ents.splice(i, 1); continue; }
    e.t++;
    if (e.hidden) {                     // a heart you took is regrowing
      e.hidden--;
      if (e.hidden === 0 && inView(e)) { S.blip();
        PT.burst(e.x, e.y, 10, { col: ['#ff4d5e', '#ffffff'], sp1: 1.5, life: 30, g: -0.03 }); }
      continue;
    }
    if (!inView(e) && e.type !== 'checkpoint' && e.type !== 'portal') continue;
    e.vx = e.vx || 0;
    switch (e.type) {
      case 'shard': case 'gel': case 'heart': {
        e.bob += 0.06;
        if (e.bob % (Math.PI * 2) < 0.06 && e.type === 'shard') PT.add({ x: e.x + rnd(-4, 4), y: e.y - 4 + rnd(-3, 3), vx: 0, vy: -0.2, col: '#ffe14f', life: 22, sz: 1, g: 0 });
        if (Math.abs(Pl.x - e.x) < 11 && Math.abs((Pl.y - Pl.h / 2) - (e.y)) < 13) {
          if (e.type === 'shard') { Run.shards++; Run.total++; S.shard(); e.dead = true;
            PT.burst(e.x, e.y, 8, { col: ['#ffe14f', '#ffffff'], sp1: 1.8, life: 22, g: -0.02 }); }
          else if (e.type === 'gel') { if (Pl.gel !== e.el) { if (Pl.gel) PT.burst(Pl.x, Pl.y - 8, 8, { col: GEL[Pl.gel].col, sp1: 2, life: 20, g: 0 });
              Pl.gel = e.el; Pl.gelT = GEL[e.el].dur; S.absorb(); squash(0.18); }
            e.dead = true; }
          else { if (Pl.hp < Pl.maxhp) Pl.hp++; else { Run.shards += 2; } S.chime();
            PT.burst(e.x, e.y, 12, { col: ['#ff4d5e', '#ffffff'], sp1: 2, life: 26, g: -0.02 });
            /* health regrows: pick it up again once the outline fills back in */
            e.hidden = e.recharge || 900; }
        }
        break; }
      case 'pad': {
        e.push = Math.max(0, (e.push || 0) - 0.08);
        if (Pl.vy >= 0 && Math.abs(Pl.x - e.x) < 11 && Pl.y > e.y - 8 && Pl.y < e.y + 6 && !Pl.dead) {
          Pl.vy = -6.5; Pl.y = e.y - 1; Pl.onGround = false; Pl.coyote = 4; Pl.jumpCut = false;
          e.push = 1; S.jump(); squash(0.3);
          PT.burst(e.x, e.y, 10, { col: ['#8ef07a', '#d9ffd0'], a: -Math.PI / 2, sp1: 2.6, life: 26, g: 0.1 });
        }
        break; }
      case 'saw': {
        e.x = e.baseX + Math.sin(e.t * e.sp) * e.range;
        if (Math.abs(Pl.x - e.x) < 12 && Math.abs((Pl.y - Pl.h / 2) - (e.y - 6)) < 14) hurtPlayer(Math.sign(Pl.x - e.x) || 1);
        if (e.t % 6 === 0) PT.add({ x: e.x + rnd(-8, 8), y: e.y - 6 + rnd(-6, 6), vx: rnd(-1, 1), vy: rnd(-1, 0), col: '#ffd15c', life: 14, sz: 1, g: 0.05 });
        break; }
      case 'piston': {
        const c = (e.t + e.phase) % e.cycle;
        e.out = c < e.cycle * 0.35 ? 1 : 0;
        e.travel = e.out ? Math.min(1, (c) / (e.cycle * 0.12)) : Math.max(0, 1 - (c - e.cycle * 0.35) / (e.cycle * 0.2));
        if (!e.out && e.wasOut) {
          if (Math.abs(Pl.x - e.x) < 14 && Pl.y > e.y - 34 && Pl.y < e.y && !Pl.dead) { hurtPlayer(Math.sign(Pl.x - e.x) || 1); }
          S.step();
        }
        e.wasOut = e.out;
        break; }
      case 'torch': {
        if (e.t % 3 === 0) PT.add({ x: e.x + rnd(-2, 2), y: e.y - 6, vx: rnd(-0.25, 0.25), vy: rnd(-1.1, -0.6),
          col: L.bg === 'frost' ? '#8fdcff' : (L.bg === 'forge' ? '#ffb14a' : '#8ef07a'), life: 26, sz: 2, g: -0.012, type: 'smoke' });
        break; }
      case 'drip': {
        if (e.t % e.every === 0) PT.add({ x: e.x + rnd(-2, 2), y: e.y, vx: 0, vy: 0.6, col: L.bg === 'forge' ? '#ffb14a' : (L.bg === 'frost' ? '#d8f6ff' : '#9fe8c8'),
          life: 60, sz: 2, g: 0.16 });
        break; }
      case 'checkpoint': {
        if (!e.on && Math.abs(Pl.x - e.x) < 26 && Math.abs(Pl.y - e.y) < 40) {
          e.on = true; L.cpX = e.x; L.cpY = e.y + 12; S.chime();
          for (let k = 0; k < 20; k++) PT.add({ x: e.x + rnd(-8, 8), y: e.y + 12, vx: rnd(-1, 1), vy: rnd(-3, -0.6),
            col: ['#ffe14f', '#8fdcff', '#ffffff'], life: 50, sz: 2, g: 0.04 });
        }
        break; }
      case 'portal': {
        e.open = true;
        if (e.t % 4 === 0) { const a = Math.random() * TAU;
          PT.add({ x: e.x + Math.cos(a) * 14, y: e.y - 14 + Math.sin(a) * 16, vx: -Math.cos(a) * 0.5, vy: -0.7,
            col: L.idx === 3 ? '#ff5470' : L.pal.lit, life: 34, sz: 2, g: -0.01 }); }
        if (Math.abs(Pl.x - e.x) < 14 && Math.abs((Pl.y - 8) - (e.y - 14)) < 18 && !Pl.dead) { State.levelDone = 30; S.portal(); }
        break; }
      case 'prop_vine': {
        if (L.t % 40 === 0 && Math.random() < 0.4) PT.add({ x: e.x + rnd(-3, 3), y: e.y + e.len, vx: 0, vy: 0.3, col: 'rgba(160,230,170,0.5)', life: 40, sz: 1, g: 0.02 });
        break; }
      case 'crate': {
        if (Math.abs(Pl.x - e.x) < 12 && Math.abs(Pl.y - 6 - e.y) < 14 && Pl.slam > 0) {
          e.dead = true; S.smash(); PT.burst(e.x, e.y, 16, { col: ['#a87438', '#d9a862'], sp1: 2.6, life: 34, g: 0.2 }); }
        break; }
      case 'relay': {
        if (e.on && e.t % 6 === 0) PT.add({ x: e.x + rnd(-6, 6), y: e.y - rnd(0, 10), vx: 0, vy: -0.4, col: '#ffe14f', life: 18, sz: 1, g: -0.02 });
        break; }
      case 'bell': {
        if (e.rang) e.shake = Math.max(0, (e.shake || 0) - 0.05);
        break; }
      case 'enemy': updateEnemy(e); break;
    }
  }
}

function updateEnemy(e) {
  const dx = Pl.x - e.x, dy = Pl.y - e.y, adx = Math.abs(dx);
  if (e.flash > 0) e.flash--;
  if (e.frozen > 0) { e.frozen--; if (e.frozen === 0) S.blip();
    if (Pl.inv <= 0 && !Pl.dead && Math.abs(dx) < e.w / 2 + 7 && Math.abs(dy) < e.h / 2 + 9 && Pl.slam > 0) { /* shatter on slam */ }
    if (Pl.inv <= 0 && !Pl.dead && Math.abs(dx) < e.w / 2 + 7 && Math.abs((Pl.y - Pl.h / 2) - (e.y - e.h / 2)) < e.h / 2 + Pl.h / 2) {
      if (Pl.slam > 0 || Pl.gel === 'heavy') killEnemy(e, 'shatter');
    }
    return; }
  if (e.stun > 0) { e.stun--; if (!e.flyer) { e.vy = Math.min(MAXFALL, e.vy + GRAV); moveBody(e); } return; }
  const face = dx > 0 ? 1 : -1;
  if (e.kind !== 'vine') e.face = adx > 6 ? face : e.face;

  /* player stomp check (ground enemies) */
  if (!e.flyer && !Pl.dead && Pl.vy > 0.6 && Pl.inv <= 0 &&
      Pl.y > e.y - e.h - 3 && Pl.y < e.y - e.h * 0.35 && Math.abs(dx) < e.w / 2 + 6) {
    if (e.killable && (!e.arm || Pl.slam > 0 || Pl.gel === 'heavy')) {
      killEnemy(e, 'stomp'); Pl.vy = -3.4; squash(-0.14); State.hitStop = 3; Cam.shake = 2.5;
    } else { e.stun = 40; e.flash = 6; S.clank(); Pl.vy = -3.0; hurtPlayer(Math.sign(dx) || 1); }
    return;
  }
  /* contact damage */
  if (e.touchHurt && !Pl.dead && Pl.inv <= 0 && (e.kind !== 'wraith' || e.visible) &&
      Math.abs(dx) < e.w / 2 + Pl.w / 2 - 2 && Math.abs((Pl.y - Pl.h / 2) - (e.y - e.h / 2)) < e.h / 2 + Pl.h / 2 - 2) {
    hurtPlayer(Math.sign(dx) || 1);
  }

  switch (e.kind) {
    case 'slime': {
      e.vx = e.face * e.spd;
      e.hop = (e.hop || 0) + 1;
      if (e.hop % 92 === 0) { e.vy = -2.6; e.sq = -0.2; }
      break; }
    case 'moth': {
      e.bob += 0.05;
      if (adx < 110 && Math.abs(dy) < 80) { e.vx = lerp(e.vx, Math.sign(dx) * e.spd, 0.03); e.vy = lerp(e.vy, Math.sign(dy) * 0.5 + Math.sin(e.bob) * 0.35, 0.04); }
      else { e.vx = Math.cos(e.bob * 0.7) * e.spd; e.vy = Math.sin(e.bob) * 0.6; }
      e.x += e.vx; e.y += e.vy; e.wob = Math.sin(e.t * 0.3);
      return; }
    case 'grit': case 'crab': case 'golem': {
      e.vx = e.face * e.spd;
      if (e.kind === 'crab') e.snap = Math.max(0, (e.snap || 0) - 1) || (adx < 30 ? 40 : 0);
      break; }
    case 'hound': {
      e.dashCd--;
      if (e.st === 'idle') { e.vx *= 0.9; if (adx < 120 && Math.abs(dy) < 26 && e.dashCd <= 0) { e.st = 'charge'; e.ct = 26; } }
      else if (e.st === 'charge') { e.ct--; e.vx = lerp(e.vx, 0, 0.2); if (e.ct <= 0) { e.st = 'dash'; e.dt = 34; S.zap(); } }
      else { e.dt--; e.vx = e.face * e.spd;
        if (e.dt <= 0 || e.hitWall) { e.st = 'idle'; e.dashCd = 110; e.hitWall = false; } 
        if (e.t % 4 === 0) PT.add({ x: e.x - e.face * 8, y: e.y - 2, vx: -e.face * 0.6, vy: -0.3, col: '#ffcf4a', life: 14, sz: 1, g: 0.05 }); }
      break; }
    case 'flan': {                                   // mirrors the player like a cold twin
      if (Math.abs(dx) < 120) { e.vx = lerp(e.vx, Pl.vx * 0.75, 0.12);
        if (Pl.vy < -1 && Math.abs(dy) < 30 && e.onGround) e.vy = -3.4; }
      else e.vx = e.face * e.spd * 0.4;
      e.sq = clamp(Pl.sq, -0.3, 0.3);
      break; }
    case 'wraith': {
      e.visible = Math.sin(e.phase + e.t * 0.03) > -0.25;
      const pull = e.visible ? 0.020 : 0.004;
      e.vx = lerp(e.vx, Math.sign(dx) * 0.75, pull); e.vy = lerp(e.vy, (Pl.y - 10 - e.y) * 0.006 + Math.sin(e.t * 0.04) * 0.35, pull);
      e.x += e.vx; e.y += e.vy;
      if (e.t % 8 === 0) PT.add({ x: e.x + rnd(-6, 6), y: e.y + rnd(-4, 8), vx: 0, vy: 0.3, col: e.visible ? 'rgba(168,132,216,0.5)' : 'rgba(90,58,127,0.25)', life: 26, sz: 2, g: 0 });
      return; }
    case 'vine': {
      const near = Math.abs(dx) < 12 && Pl.y > e.y - 6 && Pl.y < e.y + e.h + 8;
      if (near && !Pl.dead && Pl.slam <= 0) {
        e.grab = 20; Pl.vx *= 0.25; Pl.vy = Math.max(Pl.vy, 0.35);
        if (e.t % 5 === 0) PT.add({ x: Pl.x + rnd(-6, 6), y: Pl.y - rnd(0, 10), vx: rnd(-0.4, 0.4), vy: -0.3, col: '#6fae58', life: 20, sz: 1, g: 0.04 });
      } else e.grab = Math.max(0, e.grab - 1);
      e.sway = Math.sin(e.t * 0.04) * 2;
      return; }
  }
  /* common ground physics + ledge/wall handling */
  if (!e.flyer) {
    e.vy = Math.min(MAXFALL, e.vy + GRAV);
    e.hitWall = false;
    moveBody(e);
    if (e.hitWall) { e.face = -e.face; e.hitWall = false; }
    else if (e.onGround && tileAtPx(e.x + e.face * (e.w / 2 + 4), e.y + 2) === '.' && tileAtPx(e.x + e.face * (e.w / 2 + 4), e.y + 8) === '.') e.face = -e.face;
    e.sq = clamp((e.sq || 0) * 0.9, -0.3, 0.3);
  }
  if (e.y > L.h * TS + 60) e.dead = true;
}

/* --------------------------------------------------------- ENTITY DRAW -- */
function drawEnts(g) {
  for (const e of Ents) {
    if (e.dead) continue;
    const x = (e.x - Cam.x) | 0, y = (e.y - Cam.y) | 0;
    if (x < -40 || x > VW + 40 || y < -60 || y > VH + 60) continue;
    if (e.hidden) {                     // regrowing heart: a faint outline pulses
      if (e.type === 'heart') {
        const k = 1 - e.hidden / (e.recharge || 900);
        g.globalAlpha = 0.14 + 0.5 * k + 0.08 * Math.sin(e.t * 0.14);
        g.drawImage(SPR.heart0, x - 6, y - 5);
        g.globalAlpha = 1;
      }
      continue;
    }
    switch (e.type) {
      case 'shard': {
        const by = y + Math.sin(e.bob) * 2.2;
        glowDot(g, x, by, L.pal.lit, 10, 0.10);
        g.drawImage(SPR.shard, x - 5, (by - 4) | 0);
        g.fillStyle = 'rgba(255,255,255,0.6)'; if ((e.t >> 3) % 4 === 0) g.fillRect(x - 3, by - 2, 1, 1);
        break; }
      case 'gel': {
        const by = y + Math.sin(e.bob) * 2.4;
        glowDot(g, x, by, GEL[e.el].col, 16, 0.16);
        g.drawImage(SPR['gel_' + e.el], x - 6, (by - 6) | 0);
        break; }
      case 'heart': {
        const by = y + Math.sin(e.bob) * 2;
        glowDot(g, x, by, '#ff4d5e', 15, 0.15);
        g.drawImage(SPR.heart, x - 6, (by - 5) | 0);
        break; }
      case 'pad': {
        g.fillStyle = '#2c5c33'; g.fillRect(x - 8, y - 2 + (e.push || 0) * 3, 16, 5);
        g.fillStyle = '#8ef07a'; g.fillRect(x - 8, y - 4 + (e.push || 0) * 3, 16, 3);
        g.fillStyle = '#d9ffd0'; g.fillRect(x - 6, y - 4 + (e.push || 0) * 3, 3, 1);
        break; }
      case 'torch': {
        g.fillStyle = '#43301f'; g.fillRect(x - 2, y - 4, 4, 10);
        const fl = Math.sin(e.t * 0.25) * 1.5, s = 3 + Math.sin(e.t * 0.3);
        glowDot(g, x, y - 8, L.pal.lit, 34, 0.16);
        g.fillStyle = L.pal.top[1]; g.fillRect(x - s / 2 | 0, y - 10 - fl, s | 0, 5);
        g.fillStyle = '#fffbe0'; g.fillRect(x - 1, y - 8 - fl, 2, 3);
        break; }
      case 'drip': g.fillStyle = 'rgba(120,160,140,0.5)'; g.fillRect(x - 2, y, 4, 3); break;
      case 'prop_vine': {
        const img = SPR.vine;
        for (let k = 0; k < 3; k++) g.drawImage(img, x - 4 + Math.sin((L.t * 0.02) + k) * 1.5, y - 6 + k * 12);
        break; }
      case 'checkpoint': {
        const img = SPR.totem;
        if (e.on) glowDot(g, x, y - 4, '#ffe14f', 30, 0.18);
        g.drawImage(img, x - 6, y - 12);
        if (e.on) { g.fillStyle = '#ffe14f'; g.fillRect(x - 2, y - 8, 4, 4);
          g.fillStyle = '#fffbe0'; g.fillRect(x - 1 + Math.sin(e.t * 0.1) * 2, y - 14 - (e.t % 20), 2, 2); }
        break; }
      case 'portal': {
        const cy = y - 14;
        glowDot(g, x, cy, L.pal.lit, 46, 0.22);
        for (let k = 0; k < 4; k++) {
          const r = 6 + k * 4 + Math.sin(L.t * 0.05 + k) * 2;
          g.strokeStyle = k % 2 ? L.pal.lit : 'rgba(255,255,255,0.7)'; g.lineWidth = 1;
          g.beginPath(); g.ellipse(x, cy, r * 0.62, r, 0, 0, TAU); g.stroke();
        }
        g.fillStyle = '#fffbe0'; g.beginPath(); g.ellipse(x, cy, 3, 5 + Math.sin(L.t * 0.08) * 2, 0, 0, TAU); g.fill();
        break; }
      case 'saw': {
        g.save(); g.translate(x, y - 6); g.rotate(e.t * 0.3);

function drawEnemy(g, e, x, y) {
  const img = SPR[e.anim] || SPR.slime, W = img.width, H = img.height;

  if (e.kind === 'vine') { g.drawImage(img, (x - 4 + (e.sway || 0)) | 0, (y - 12) | 0);

  g.translate(x, y - dh / 2); if (e.face < 0) g.scale(-1, 1);
  g.drawImage(img, -dw / 2, -dh / 2, dw, dh);
  if (e.flash > 0) { const wv = SPR[e.anim + '_w']; if (wv) g.drawImage(wv, -dw / 2, -dh / 2, dw, dh); }
  g.restore();
  if (e.frozen > 0) {                              // ice shell
    g.fillStyle = 'rgba(120,200,255,0.42)'; g.fillRect(x - W / 2 - 1, y - H - 1, W + 2, H + 2);
    g.fillStyle = 'rgba(230,248,255,0.75)'; g.fillRect(x - W / 2, y - H - 1, W, 1); g.fillRect(x - W / 2, y - 1, W, 1);
    g.fillStyle = '#e8f8ff'; g.fillRect(x - W / 2 + 2, y - H + 2, 2, 2);

  if (e.arm && e.frozen <= 0 && e.hp > 1) { g.fillStyle = 'rgba(255,255,255,0.5)'; g.fillRect(x - 6, y - H - 4, 12 * (e.hp / 2), 1); }

function glowDot(g, x, y, col, r, a) {

  g.globalAlpha = 1;

/* ==== p11_boss.js ==== */
/* ============================================================ THE BOSS === */
let boss = null;
const Haz = [];
const FINCOLS = [];

function spawnBoss() {
  Haz.length = 0; FINCOLS.length = 0;
  for (let ty = 0; ty < L.h; ty++) for (let tx = 0; tx < L.w; tx++) if (L.grid[ty][tx] === '=') {
    if (!FINCOLS.some(f => f.tx === tx)) FINCOLS.push({ tx, ty, x: tx * TS + TS / 2, y: ty * TS });
  }
  const sp = L.bossSpawn || { x: 400, y: 200 };
  boss = {
    x: sp.x, y: sp.y, vx: 0, vy: 0, w: 34, h: 84, hp: 52, maxhp: 52, phase: 1,
    state: 'intro', t: 0, st: 0, atk: null, atkT: 0, cd: 60, face: -1, hurtCd: 0, flash: 0,
    alive: true, dying: 0, intro: 150, stagger: 0, stun: 0, walk: 0, mood: [90, 220, 255],
    bsod: null, arms: [1, 1], loose: [], assemble: [], dmgFlash: 0, leap: null, spawnCd: 0, title: 0
  };
  // parts that fly in during the assembly intro
  for (let i = 0; i < 14; i++) {
    boss.assemble.push({ a: Math.random() * TAU, d: 200 + Math.random() * 260, k: i, r: Math.random() * TAU });
  }

}
const bossMood = () => {
  if (!boss) return [120, 220, 255];
  if (boss.phase >= 3) return [255, 70, 70];
  if (boss.phase === 2) return [255, 190, 70];
  return [90, 225, 255];
};
function bossHurtAmount(d) {
  if (!boss.alive || boss.state === 'dying') return;
  if (!boss.stun) {                                  // armour: chip it, and build toward a stagger
    const chip = d >= 4 ? 2 : 1;
    boss.hp = Math.max(1, boss.hp - chip);
    boss.chips = (boss.chips || 0) + 1;
    S.clank(); boss.flash = 4;
    PT.burst(boss.x, boss.y - 40, 6, { col: '#ffe14f', sp1: 2.4, life: 18, g: 0.1 });
    if (boss.chips >= 8) {                           // eight clean hits jam the joints
      boss.chips = 0; boss.state = 'idle'; boss.atk = null; boss.leap = null;
      boss.bsod = null; boss.mark = null; S.slam(); Cam.shake = 6;
      PT.burst(boss.x, boss.y - 44, 26, { col: ['#ffe14f', '#ffffff'], sp1: 3.4, life: 40, g: 0.06 });
      const ph = boss.hp <= boss.maxhp * 0.33 ? 3 : (boss.hp <= boss.maxhp * 0.66 ? 2 : 0);
      if (ph && boss.phase < ph) setPhase(ph);       // setPhase clears stun, so re-apply after
      boss.stun = 140;
    }
    return;
  }
  boss.hp -= d; boss.flash = 8; boss.dmgFlash = 10; S.bossHurt(); State.hitStop = 4; Cam.shake = 3;
  const m = bossMood();
  PT.burst(boss.x + rnd(-14, 14), boss.y - rnd(20, 70), 16, { col: ['#ffe14f', `rgb(${m[0]},${m[1]},${m[2]})`, '#ffffff'], sp1: 3, life: 34, g: 0.18 });
  if (boss.hp <= 0) beginBossDeath();
  else if (boss.hp <= boss.maxhp * 0.33 && boss.phase < 3) setPhase(3);
  else if (boss.hp <= boss.maxhp * 0.66 && boss.phase < 2) setPhase(2);
}
function setPhase(p) {
  boss.phase = p; boss.stun = 0; boss.atk = null; boss.cd = 40;
  Cam.shake = 8; S.slam(); S.clank();
  const m = bossMood();
  PT.burst(boss.x, boss.y - 44, 40, { col: [`rgb(${m[0]},${m[1]},${m[2]})`, '#ffffff', '#ffe14f'], sp1: 4, life: 50, g: 0.05 });
  if (p === 3) { A.play('boss3'); State.quake = 1; }
}
function beginBossDeath() {
  boss.state = 'dying'; boss.alive = false; boss.dying = 0; boss.stun = 0; boss.bsod = null;
  boss.mark = null; Haz.length = 0; State.warn = null; A.stopMusic(); S.bossDie(); Cam.shake = 7;
}

function projHitsBoss(p) {
  if (!boss || !boss.alive) return false;
  if (Math.abs(p.x - boss.x) < boss.w / 2 + 6 && p.y > boss.y - boss.h && p.y < boss.y) {
    bossHurtAmount(p.el === 'ember' ? 4 : p.el === 'charge' ? 4 : p.el === 'heavy' ? 5 : 3);
    if (p.el === 'frost') { boss.chill = 60; }

  }
  return false;
}

function updateBoss() {
  if (!boss) return;
  const bs = boss; bs.t++;
  bs.mood = bossMood();
  if (bs.flash > 0) bs.flash--;
  if (bs.dmgFlash > 0) bs.dmgFlash--;
  if (bs.chill > 0) bs.chill--;

  /* ---------------- intro: assembly ---------------- */
  if (bs.state === 'intro') {
    bs.intro--;
    for (const a of bs.assemble) { a.d *= 0.925; a.r += 0.06; }
    if (bs.t % 6 === 0) { S.clank(); Cam.shake = 2; }
    if (bs.intro === 40) bs.title = 120;
    if (bs.title > 0) bs.title--;
    if (bs.intro <= 0) { bs.state = 'idle'; bs.cd = 40; S.slam(); Cam.shake = 8;
      PT.burst(bs.x, bs.y - 44, 34, { col: ['#5a4a70', '#ffe14f', '#9be8ff'], sp1: 3.4, life: 44, g: 0.12 }); }
    return;
  }
  /* ---------------- death ---------------- */
  if (bs.state === 'dying') {
    bs.dying++;
    const m = bs.dying;
    if (m % 9 === 0 && bs.loose.length < 16) {
      const side = m % 18 === 0 ? -1 : 1;
      const kinds = ['arm', 'arm', 'shoulder', 'shoulder', 'torso', 'torso', 'leg', 'leg', 'head'];
      const kind = kinds[Math.min(kinds.length - 1, (m / 9) | 0)];
      bs.loose.push({ kind, x: bs.x + side * rnd(6, 22), y: bs.y - rnd(20, 78), vx: side * rnd(0.6, 2.2),
        vy: rnd(-2.2, -0.4), r: 0, vr: rnd(-0.14, 0.14), life: 220 });

    }
    for (const p of bs.loose) { p.vy = Math.min(4, p.vy + 0.22); p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if (p.y > L.h * TS - 3 * TS - 4) { p.y = L.h * TS - 3 * TS - 4; p.vy *= -0.32; p.vx *= 0.6; p.vr *= 0.5; }
      if (p.t === undefined) p.t = 0; p.t++; }
    if (m === 150) { bs.dimm = { x: bs.x, y: bs.y - 30, t: 0 }; S.win(); }
    if (bs.dimm) { bs.dimm.t++; bs.dimm.y -= 0.5;
      if (bs.dimm.t % 4 === 0) PT.add({ x: bs.dimm.x + rnd(-6, 6), y: bs.dimm.y + rnd(-6, 6), vx: rnd(-0.4, 0.4), vy: rnd(-1, -0.2), col: '#ffe14f', life: 40, sz: 2, g: -0.01 }); }
    if (m % 14 === 0) Cam.shake = 3;
    if (m > 215) { State.victoryAt = L.t + 6; State.set('cutscene'); }
    return;
  }
  /* ---------------- phase 3 ambient ---------------- */
  if (bs.phase >= 3 && bs.t % 5 === 0) {
    PT.add({ x: bs.x + rnd(-16, 16), y: bs.y - rnd(20, 80), vx: rnd(-0.3, 0.3), vy: rnd(-1.2, -0.4),
      col: 'rgba(60,50,55,0.5)', life: 46, sz: 2, g: -0.01, type: 'smoke' });
  }
  /* ---------------- contact damage ---------------- */
  if (bs.alive && !Pl.dead && Pl.inv <= 0 && bs.stun <= 0 &&
      Math.abs(Pl.x - bs.x) < bs.w / 2 + Pl.w / 2 && Pl.y > bs.y - bs.h && Pl.y < bs.y + 4) hurtPlayer(Math.sign(Pl.x - bs.x) || 1);
  if (!Pl.dead && Pl.inv <= 0 && bs.stun > 0 &&
      Math.abs(Pl.x - bs.x) < bs.w / 2 + Pl.w / 2 && Pl.y > bs.y - bs.h && Pl.y < bs.y + 4 && Pl.vy > 1) {
    bossHurtAmount(6); Pl.vy = -3.6;
  }

  /* ---------------- stun / stagger ---------------- */
  if (bs.stun > 0) {
    bs.stun--; bs.vx *= 0.8;
    if (bs.t % 10 === 0) PT.burst(bs.x + rnd(-14, 14), bs.y - rnd(30, 80), 3, { col: '#ffe14f', sp1: 1.4, life: 24, g: 0.1 });
    if (bs.stun === 0) { bs.state = 'idle'; bs.cd = 30; }
    bs.x = clamp(bs.x + bs.vx, 20, L.w * TS - 20);
    return;
  }

  /* ---------------- AI ---------------- */
  const toP = Pl.x - bs.x, adx = Math.abs(toP);
  bs.face = toP > 0 ? 1 : -1;
  bs.vy = Math.min(MAXFALL * 1.2, bs.vy + GRAV * 1.15);

  if (bs.state === 'idle') {
    bs.walk = (bs.walk || 0) + 1;
    const spd = bs.phase >= 3 ? 1.15 : (bs.phase === 2 ? 0.82 : 0.55);
    bs.vx = lerp(bs.vx, Math.sign(toP) * spd, 0.08);
    bs.x += bs.vx;
    bs.x = clamp(bs.x, 24, L.w * TS - 24);
    bs.y += bs.vy;
    if (bs.y >= L.h * TS - 3 * TS) { bs.y = L.h * TS - 3 * TS; bs.vy = 0; if (!bs.ground) { bs.ground = true; } }
    else bs.ground = false;
    if (bs.ground && bs.walk % (bs.phase >= 3 ? 22 : 34) === 0) { S.step(); Cam.shake = Math.max(Cam.shake, 1.6);
      PT.burst(bs.x + rnd(-12, 12), bs.y, 4, { col: L.pal.rock[2], a: -Math.PI / 2, sp1: 1.2, life: 18, g: 0.12 }); }
    if (--bs.cd <= 0) pickBossAttack();
  } else if (bs.state === 'attack') {
    runBossAttack();
  }
  bs.st++;
}

function pickBossAttack() {
  const bs = boss, p = bs.phase;
  bs.state = 'attack'; bs.atkT = 0; bs.st = 0;
  const pool = p === 1 ? ['slam', 'slam', 'toss', 'leak']
    : p === 2 ? ['slam', 'toss', 'sweep', 'burst', 'mark', 'slam', 'burst']
    : ['slam', 'sweep', 'burst', 'mark', 'toss', 'slam', 'burst'];
  if (p === 3 && !bs.bsodDone && bs.t - (bs.bsodAt || -999) > 420) bs.atk = 'bsod';
  else { bs.atk = pool[(Math.random() * pool.length) | 0]; }

    let target = null, bestD = 110;

      const d = Math.abs(f.x - Pl.x);
      if (d < bestD) { bestD = d; target = f; }

    if (bs.atkT > 76) { bs.spin = 0; bs.state = 'idle'; bs.cd = bs.phase >= 3 ? 26 : 48; }

        bs.stun = 210; S.clank(); Cam.shake = 6;         // staggered and exposed
        PT.burst(bs.x, bs.y - 40, 26, { col: ['#ffe14f', '#ffffff'], sp1: 3, life: 40, g: 0.1 });
      }
    }
    return;
  }
}

/* ------------------------------------------------------- hazard objects -- */
function updateHaz() {
  for (let i = Haz.length - 1; i >= 0; i--) {
    const h = Haz[i]; h.t++; h.life--;
    if (h.kind === 'wave') { h.x += h.vx;

/* ------------------------------------------ RAM-stick + golem rendering -- */
function drawRamStick(g, x, y, w, h, mood) {
  g.fillStyle = '#1d2a1a'; g.fillRect(x, y, w, h);
  g.fillStyle = '#2f4a2a'; g.fillRect(x, y, w, Math.max(1, h - 2));
  g.fillStyle = '#0f1a0f'; g.fillRect(x, y + h - 2, w, 2);
  // gold contact fingers along the bottom
  g.fillStyle = '#d9b64a';
  for (let i = 1; i < w - 1; i += 3) g.fillRect(x + i, y + h - 3, 2, 2);
  // chips
  const n = Math.max(1, (w / 8) | 0);
  for (let i = 0; i < n; i++) {
    const cx = x + 2 + i * (w - 4) / n;
    g.fillStyle = '#14181c'; g.fillRect(cx | 0, y + 2, Math.max(2, ((w - 4) / n) - 2), Math.max(1, h - 5));
    g.fillStyle = `rgba(${mood[0]},${mood[1]},${mood[2]},0.55)`;
    g.fillRect((cx | 0) + 1, y + 3, 1, 1);
  }
  // notch + label
  g.fillStyle = '#c8c2b4'; g.fillRect(x + 1, y + 1, 1, Math.max(1, h - 3));
}
function drawBoss(g) {
  const bs = boss; if (!bs) return;
  const x = bs.x - Cam.x, y = bs.y - Cam.y, m = bs.mood;
  const moodRGB = `rgb(${m[0]},${m[1]},${m[2]})`;
  const die = bs.state === 'dying' ? clamp(1 - bs.dying / 200, 0, 1) : 1;
  const dying = bs.state === 'dying';
  const introK = bs.state === 'intro' ? clamp(1 - bs.intro / 150, 0, 1) : 1;
  // RGB aura
  if (!dying) {
    g.globalAlpha = 0.10 + (bs.phase >= 3 ? 0.10 : 0) + (bs.stun > 0 ? 0.06 : 0);
    g.fillStyle = moodRGB;
    for (let i = 3; i >= 1; i--) { g.beginPath(); g.ellipse(x, y - 44, 26 + i * 9, 48 + i * 9, 0, 0, TAU); g.fill(); }
    g.globalAlpha = 1;
  }
  const A0 = { x, y, k: introK };
  const jitter = bs.stun > 0 ? Math.sin(bs.t * 0.6) * 1.6 : (bs.phase >= 3 ? Math.sin(bs.t * 0.9) * 0.7 : 0);
  const bob = Math.sin(bs.t * 0.05) * 1.5 + (bs.state === 'idle' ? Math.abs(Math.sin(bs.walk * 0.09)) * 1.5 : 0);
  const part = (px, py, pw, ph, rot, scale) => {
    g.save(); g.translate(x + px + jitter, y + py - bob);
    if (rot) g.rotate(rot); if (scale != null) g.scale(scale, scale);
    g.globalAlpha = die;
    drawRamStick(g, -pw / 2, -ph / 2, pw, ph, dying ? [40, 44, 46] : m);
    g.restore();
  };
  // legs
  const legSw = bs.state === 'idle' ? Math.sin(bs.walk * 0.09) * 0.12 : 0;
  if (!dying || bs.dying < 120) {
    part(-11, -12, 12, 26, legSw); part(11, -12, 12, 26, -legSw);
    // feet: gold fingers down
    g.fillStyle = '#d9b64a'; g.fillRect(x - 18 + jitter, y - 3, 14, 3); g.fillRect(x + 4 + jitter, y - 3, 14, 3);
  }
  // torso: PCB plates + ribcage of gold fingers
  if (!dying || bs.dying < 130) {
    part(0, -44, 34, 30, 0, 1);
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x - 17 + jitter, y - 60 - bob, 34, 3);
    g.fillStyle = dying ? '#2a2a2c' : '#e0c25c';
    for (let i = 0; i < 6; i++) g.fillRect(x - 14 + i * 5 + jitter, y - 56 - bob + Math.sin(bs.t * 0.08 + i) * 1, 3, 16);
    // heat spreader pauldrons
    g.fillStyle = '#8f8899'; g.fillRect(x - 26 + jitter, y - 62 - bob, 12, 10); g.fillRect(x + 14 + jitter, y - 62 - bob, 12, 10);
    g.fillStyle = '#d5cfe2'; g.fillRect(x - 26 + jitter, y - 62 - bob, 12, 2); g.fillRect(x + 14 + jitter, y - 62 - bob, 12, 2);
  }
  // arms (RAM sticks) - one comes off for the boomerang
  const spin = bs.spin || 0;
  const armRot = bs.atk === 'sweep' ? spin : (bs.atk === 'slam' && bs.vy < 0 ? -0.9 : Math.sin(bs.t * 0.06) * 0.12);
  if (!dying || bs.dying < 60) {
    if (bs.arms[0]) part(-24 + Math.cos(armRot) * 4, -46, 9, 34, armRot);
    if (bs.arms[1] !== 0) part(24 - Math.cos(armRot) * 4, -46, 9, 34, -armRot);
    // fists
    g.fillStyle = '#8f8899'; g.fillRect(x - 30 + jitter, y - 26 - bob, 10, 8); g.fillRect(x + 20 + jitter, y - 26 - bob, 10, 8);
  }
  // head: cracked CPU IHS
  if (!dying || bs.dying < 190) {
    const hy = y - 74 - bob + (bs.stun > 0 ? Math.sin(bs.t * 0.5) * 2 : 0);
    g.fillStyle = '#b8b2c4'; g.fillRect(x - 12 + jitter, hy - 8, 24, 20);
    g.fillStyle = '#8f8899'; g.fillRect(x - 12 + jitter, hy + 8, 24, 4);
    g.fillStyle = '#d5cfe2'; g.fillRect(x - 10 + jitter, hy - 6, 20, 3);
    g.strokeStyle = 'rgba(30,26,38,0.8)'; g.lineWidth = 1; g.beginPath();
    g.moveTo(x - 8 + jitter, hy - 8); g.lineTo(x - 3 + jitter, hy); g.lineTo(x - 7 + jitter, hy + 7); g.stroke();
    // eye slits (the mood ring you read)
    g.fillStyle = dying ? '#20242a' : moodRGB;
    g.fillRect(x - 9 + jitter, hy - 1, 7, 3); g.fillRect(x + 2 + jitter, hy - 1, 7, 3);
    if (!dying) { glowDot(g, x - 5 + jitter, hy + 0.5, moodRGB, 12, 0.35); glowDot(g, x + 5 + jitter, hy + 0.5, moodRGB, 12, 0.35); }
    // pin row under the head
    g.fillStyle = '#d9b64a'; for (let i = 0; i < 8; i++) g.fillRect(x - 10 + i * 3 + jitter, hy + 12, 2, 3);
  }
  // loose debris during death
  for (const p of bs.loose) {
    g.save(); g.translate((p.x - Cam.x) | 0, (p.y - Cam.y) | 0); g.rotate(p.r);
    g.globalAlpha = clamp(1 - p.t / 200, 0, 1);
    const sz = p.kind === 'head' ? [16, 14] : p.kind === 'leg' ? [10, 22] : p.kind === 'torso' ? [22, 16] : p.kind === 'shoulder' ? [14, 10] : [8, 28];
    drawRamStick(g, -sz[0] / 2, -sz[1] / 2, sz[0], sz[1], [30, 34, 36]);
    g.restore();
  }
  // the golden DIMM that rises out of the rubble
  if (bs.dimm) {
    const dx = (bs.dimm.x - Cam.x) | 0, dy = (bs.dimm.y - Cam.y) | 0;
    glowDot(g, dx, dy, '#ffe14f', 44, 0.30);
    g.save(); g.translate(dx, dy); g.rotate(Math.sin(bs.dimm.t * 0.05) * 0.25);
    g.fillStyle = '#2f4a2a'; g.fillRect(-14, -5, 28, 10);
    g.fillStyle = '#ffe14f'; for (let i = 0; i < 8; i++) g.fillRect(-13 + i * 3.4, 3, 2, 3);
    g.fillStyle = '#fff6c8'; g.fillRect(-10, -3, 20, 4);
    g.restore();
  }
  // flash on damage
  if (bs.flash > 0) { g.globalAlpha = 0.55; g.fillStyle = '#ffffff';
    g.fillRect(x - 26 + jitter, y - 84, 52, 84); g.globalAlpha = 1; }
  // stagger cue
  if (bs.stun > 0) {
    const yy = y - 92 - Math.sin(bs.t * 0.1) * 2;
    g.fillStyle = '#ffe14f';
    for (let i = 0; i < 3; i++) { const a = bs.t * 0.07 + i * TAU / 3;
      g.fillRect(x + Math.cos(a) * 12 - 1, yy + Math.sin(a) * 4, 3, 3); }
    g.fillStyle = 'rgba(255,255,255,0.9)'; g.font = '7px monospace';
    g.textAlign = 'center'; g.fillText('STAGGERED', x, yy - 8);
  }
}


/* ==== p12_ui.js ==== */
/* ======================================================== TILE RENDER === */
function drawTiles(g) {
  const tx0 = Math.max(0, Math.floor(Cam.x / TS)), tx1 = Math.min(L.w - 1, Math.ceil((Cam.x + VW) / TS));
  const ty0 = Math.max(0, Math.floor(Cam.y / TS)), ty1 = Math.min(L.h - 1, Math.ceil((Cam.y + VH) / TS));
  const T = L.T;
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      const c = L.grid[ty][tx];
      if (c === '.') continue;
      const x = (tx * TS - Cam.x) | 0, y = (ty * TS - Cam.y) | 0;
      const v = (hash2(tx, ty) * 4) | 0;
      let img = null;
      if (c === '#') {
        const openTop = L.grid[Math.max(0, ty - 1)][tx] === '.';
        img = openTop ? T.top[v] : T.rock[v];
      } else if (c === '=') img = T.deck[v];
      else if (c === '^') img = T.oneway[v];
      else if (c === 'I') img = T.ice[v];
      else if (c === '%') { img = T.ice[v]; }
      else if (c === 'B') img = T.br[v];
      else if (c === '!') img = T.spike[v];
      else if (c === '~' || c === 'o') {
        const f = ((tx * 3 + (L.t * 0.35 | 0)) % 4);
        g.drawImage(T.liq[f], x, y);
        if (L.grid[Math.max(0, ty - 1)][tx] !== '~' && L.grid[Math.max(0, ty - 1)][tx] !== 'o') {
          g.fillStyle = c === 'o' ? 'rgba(255,215,120,0.85)' : 'rgba(200,240,255,0.6)';
          for (let i = 0; i < 16; i += 2) g.fillRect(x + i, y + Math.round(Math.sin((i + L.t * 0.4 + tx * 3) * 0.5) * 1.2), 2, 1);
        }
        if (c === 'o' && L.t % 7 === 0 && Math.random() < 0.5)
          PT.add({ x: tx * TS + rnd(2, 14), y: ty * TS + 2, vx: rnd(-0.3, 0.3), vy: rnd(-1.4, -0.6), col: '#ffb14a', life: 34, sz: 2, g: -0.01, type: 'smoke' });
        continue;
      } else if (c === 'T') {
        g.fillStyle = '#4b4759'; g.fillRect(x, y, TS, TS);
        g.fillStyle = '#ffe14f'; for (let i = -TS; i < TS; i += 6) { g.beginPath();
          g.moveTo(x + i, y + TS); g.lineTo(x + i + 3, y + TS); g.lineTo(x + i + TS + 3, y); g.lineTo(x + i + TS, y); g.closePath(); g.fill(); }
        g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x, y, TS, 2);
        continue;
      } else if (c === 'e') {
        const on = (L.t % 40) < 30;
        g.fillStyle = '#3a2020'; g.fillRect(x, y + 10, TS, 6);
        g.fillStyle = on ? '#ffe14f' : '#6b6355'; g.fillRect(x, y + 8, TS, 3);
        g.fillStyle = '#ff5470'; g.fillRect(x + 2, y + 6, 2, 2); g.fillRect(x + 12, y + 6, 2, 2);
        if (on && L.t % 5 === 0) PT.add({ x: tx * TS + rnd(0, 16), y: ty * TS + 8, vx: rnd(-0.4, 0.4), vy: rnd(-1.6, -0.4), col: '#ffe14f', life: 16, sz: 1, g: 0.02 });
        if (on) glowDot(g, x + 8, y + 10, '#ffe14f', 14, 0.10);
        continue;
      }
      if (img) g.drawImage(img, x, y);
      if (c === '%') { g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 1; g.beginPath();
        g.moveTo(x + 3, y + 3); g.lineTo(x + 8, y + 8); g.lineTo(x + 4, y + 13); g.moveTo(x + 13, y + 4); g.lineTo(x + 9, y + 11); g.stroke(); }
    }
  }
  drawVents(g);
}

/* air jets: a floor grate with an impeller, and side lamps that charge up
   just before the blast so you can time a ride */
function drawVents(g) {
  for (const f of L.fans) {
    const x = (f.x0 - Cam.x) | 0, y = (f.y0 - Cam.y) | 0, w = f.x1 - f.x0;
    if (x + w < -20 || x > VW + 20 || y < -30 || y > VH + 40) continue;

    g.fillStyle = '#141a24';

    g.save(); g.translate(x + w / 2, y - 4); g.rotate(f.on ? L.t * 0.5 : L.t * 0.06);
    g.fillStyle = lerpCol('#3c4657', '#a9c6e8', k);

}

}

/* ============================================================== HUD ===== */
function drawHUD(g) {
  // health: hearts, Zelda style — the last one throbs when it is all you have
  for (let i = 0; i < Pl.maxhp; i++) {
    const on = i < Pl.hp;
    const blink = Pl.hp === 1 && i === 0 && (L.t % 44) < 16;
    const yy = 7 + Math.sin(L.t * 0.07 + i * 0.9) * (on ? 1.1 : 0);
    g.drawImage(on ? (blink ? SPR.heartLo : SPR.heart) : SPR.heart0, 7 + i * 13, yy | 0);
    if (on && !blink) glowDot(g, 12 + i * 13, 12 + yy, '#ff4d5e', 11, 0.10);
  }
  // shards
  g.drawImage(SPR.shard, 8, 24);
  txt(g, String(Run.total).padStart(3, '0'), 22, 25, 9, '#ffe14f');
  // gel slot
  if (Pl.gel) {
    const G = GEL[Pl.gel];
    g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(44, 24, 40, 12);
    g.drawImage(SPR['gel_' + Pl.gel], 45, 24);
    txt(g, G.name, 58, 26, 8, G.lite);
    g.fillStyle = G.col; g.fillRect(44, 37, 40 * clamp(Pl.gelT / G.dur, 0, 1), 2);
  }
  // glob magazine: how many globs you can still spit right now
  const freeG = MAX_GOO - gooCount();
  for (let i = 0; i < MAX_GOO; i++) {
    const x = 11 + i * 10, y = 45, on = i < freeG;
    g.fillStyle = on ? 'rgba(79,214,166,0.95)' : 'rgba(130,150,160,0.25)';
    g.beginPath(); g.arc(x, y, 3.2, 0, TAU); g.fill();
    if (on) { g.fillStyle = 'rgba(201,255,232,0.85)'; g.fillRect(x - 2, y - 2, 1, 1); }
  }
  // timer + level
  const secs = Math.floor(Run.time / 60);
  txt(g, `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`, VW - 8, 8, 9, 'rgba(255,255,255,0.75)', 'right');
  txt(g, L.def.pal === 'L4' ? 'THE HEAT SINK' : 'LVL ' + (L.idx + 1) + ' ' + L.pal.name, VW - 8, 19, 8, 'rgba(255,255,255,0.45)', 'right');

/* ======================================================== STATE MACHINE == */
const State = {
  id: 'title', hitStop: 0, levelDone: 0, quake: 0, warn: null, t: 0, sub: 0,
  victoryAt: 0, cut: null, card: 0,
  set(id) { if (this.id === id) return; this.id = id; this.sub = 0; this.t = 0;
    if (id === 'cutscene') this.cut = { conf: [], dimm: 0, led: 0, city: 0 }; },
  onKey(code) {
    if (code === 'KeyM') { A.setMute(!A.muted); S.blip(); return true; }
    if (this.id === 'title') {
      if (code === 'Enter' || code === 'Space') { A.resume(); S.blip(); newGame(); return true; }
    } else if (this.id === 'intro') { if (code === 'Enter') this.card = 0; }
    else if (this.id === 'play') { if (code === 'KeyP') { this.set('pause'); S.pause(); return true; } }
    else if (this.id === 'pause') { if (code === 'KeyP' || code === 'Enter') { this.set('play'); S.pause(); return true; }
      if (code === 'KeyR') { restartLevel(); return true; } }
    else if (this.id === 'clear') { if (code === 'Enter' && this.sub > 30) advanceLevel(); }
    else if (this.id === 'gameover') { if (code === 'Enter' || code === 'KeyR') retry(); }
    else if (this.id === 'cutscene') { if (this.t > 90 && code === 'Enter') { this.t = 9999; } }
    else if (this.id === 'credits') { if (code === 'Enter' && this.t > 120) { this.set('title'); A.play('title'); } }
    return false;
  },
  update() {
    this.t++; this.sub++;
    if (this.id === 'title') updateTitle();
    else if (this.id === 'intro') { if (this.t > 150) { this.set('play'); startTrackForLevel(); } }
    else if (this.id === 'play') updatePlay();
    else if (this.id === 'clear') { if (this.t > 200) advanceLevel(); }
    else if (this.id === 'gameover') { PT.update(); }
    else if (this.id === 'cutscene') updateCutscene();
    else if (this.id === 'credits') updateCredits();
  }
};

function startTrackForLevel() {
  const id = L.idx === 0 ? 'l1' : L.idx === 1 ? 'l2' : L.idx === 2 ? 'l3' : null;
  if (id) A.play(id);
}
function newGame() {
  Run.level = 0; Run.total = 0; Run.shards = 0; Run.time = 0; Run.deaths = 0; Run.kills = 0;
  resetPlayer(true); loadLevelInto(0);
  State.set('intro');
}
function loadLevelInto(i) {
  Run.level = i;
  loadLevel(i, true);
  boss = (i === LEVELS.length - 1) ? null : null;
  Cam.shake = 0; Cam.x = Cam.y = 0;
  Pl.x = L.spawnX; Pl.y = L.spawnY; Pl.face = 1;
  resetPlayer(false);
  Cam.snap(Pl, L);
  if (i === LEVELS.length - 1) spawnBoss();
}
function restartLevel() {
  loadLevelInto(Run.level); Pl.hp = Pl.maxhp; Run.deaths++; State.set('intro');
}
function retry() {
  if (Pl.hp <= 0) { loadLevelInto(Run.level); Pl.hp = Pl.maxhp; }
  else { Pl.x = L.cpX != null ? L.cpX : L.spawnX; Pl.y = L.cpY != null ? L.cpY : L.spawnY; resetPlayer(false); }
  Cam.snap(Pl, L); State.set('play'); startTrackForLevel();
}
function advanceLevel() {
  const nxt = Run.level + 1;
  if (nxt >= LEVELS.length) { State.set('credits'); return; }
  loadLevelInto(nxt); State.set('intro');
}

/* ------------------------------------------------------------- PLAY ----- */
function updatePlay() {
  if (State.hitStop > 0) { State.hitStop--; PT.update(); return; }
  Run.time++;
  if (State.warn) State.warn = null;
  updatePlayer();
  updateEnts();
  updateProj();
  if (boss) updateBoss();
  if (Haz.length) updateHaz();
  PT.update();
  Cam.follow(Pl, L);
  if (State.levelDone > 0) {
    State.levelDone--;
    if (State.levelDone === 0) {
      S.win();
      PT.burst(Pl.x, Pl.y - 10, 40, { col: ['#ffe14f', '#8ef0c8', '#ffffff'], sp1: 4, life: 70, g: 0.03, type: 'conf' });
      A.stopMusic();
      State.set('clear');
    }
  }
}
function updateTitle() {
  TitleT++;
  if (TitleT % 14 === 0) PT.add({ x: rnd(0, VW), y: VH + 4, vx: rnd(-0.2, 0.2), vy: rnd(-1.2, -0.5),
    col: ['rgba(79,214,166,0.5)', 'rgba(143,240,200,0.4)', 'rgba(255,225,79,0.35)'][(Math.random() * 3) | 0], life: 200, sz: 2, g: -0.004 });
  PT.update();
}
let TitleT = 0;

/* ============================================================ CUTSCENE == */
function updateCutscene() {
  const t = State.t;
  if (t === 1) { A.play('cut'); State.cut = { conf: [], dimm: 0, led: 0, city: 0 }; PT.pool.length = 0; }
  if (t > 240 && t % 6 === 0 && State.cut.conf.length < 120) {
    State.cut.conf.push({ x: rnd(-10, VW + 10), y: -8, vx: rnd(-0.4, 0.4), vy: rnd(0.7, 1.9), r: Math.random() * TAU,
      vr: rnd(-0.1, 0.1), col: ['#ffe14f', '#8ef0c8', '#8fdcff', '#ff9ec4', '#ffffff'][(Math.random() * 5) | 0], life: 320 });
  }
  const c = State.cut;
  for (const p of c.conf) { p.x += p.vx + Math.sin((p.y + p.r * 30) * 0.02) * 0.4; p.y += p.vy; p.r += p.vr; }
  for (let i = c.conf.length - 1; i >= 0; i--) if (c.conf[i].y > VH + 12) c.conf.splice(i, 1);
  if (t > 1180) {
    const secs = Math.floor(Run.time / 60);
    const mm = Math.floor(secs / 60), ss = secs % 60;
    if (!Run.best || Run.time < Run.best) Run.best = Run.time;
    if (Run.total >= 100) Run.overclock = true;
    saveRun();
    State.cutTime = `${mm}:${String(ss).padStart(2, '0')}`;
    A.stopMusic(); A.play('end'); S.win();
    State.set('credits');
  }
}

}
function lerpCol(a, b, t) {
  const pa = hex2(a), pb = hex2(b);
  return `rgb(${Math.round(lerp(pa[0], pb[0], t))},${Math.round(lerp(pa[1], pb[1], t))},${Math.round(lerp(pa[2], pb[2], t))})`;
}
function hex2(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }

  txt(g, 'P  pause      M  mute      R  restart level', VW / 2, 184, 8, 'rgba(255,255,255,0.7)', 'center');
  txt(g, 'three globs in the air at most — gel loads special ammo for a while', VW / 2, 198, 8, 'rgba(255,225,79,0.75)', 'center');
  const best = Run.best ? `${Math.floor(Math.floor(Run.best / 60) / 60)}:${String(Math.floor(Run.best / 60) % 60).padStart(2, '0')}` : '--';
  txt(g, 'BEST ' + best + (Run.overclock ? '   ★ OVERCLOCK' : ''), VW / 2, VH - 22, 9, 'rgba(255,255,255,0.55)', 'center');
  PT.draw(g, { x: 0, y: 0 });
}

/* ========================================================== OVERLAYS ==== */
function drawIntroCard(g) {
  const k = clamp(State.t / 24, 0, 1), out = State.t > 126 ? clamp((State.t - 126) / 24, 0, 1) : 0;
  g.globalAlpha = 1 - out;
  g.fillStyle = 'rgba(6,10,14,0.86)'; g.fillRect(0, 0, VW, VH);
  const y = lerp(20, 92, k);
  bigTitle(g, L.pal.name, VW / 2, y, L.pal.lit);
  txt(g, L.def.pal === 'L4' ? 'BOSS' : 'LEVEL ' + (L.idx + 1), VW / 2, y + 44, 10, 'rgba(255,255,255,0.6)', 'center');
  txt(g, L.pal.sub, VW / 2, y + 58, 9, L.pal.lit, 'center');
  if (L.idx === 0) txt(g, L.def.hint, VW / 2, y + 78, 8, 'rgba(255,255,255,0.7)', 'center');
  if (L.idx === 3) {
    txt(g, 'ride the floor jets up to the fins, pelt him, drop back down', VW / 2, y + 78, 8, '#ff9ec4', 'center');
    txt(g, 'eight clean hits jam his armour — then squish him', VW / 2, y + 90, 8, '#ff9ec4', 'center');
  }
  g.globalAlpha = 1;
  const blink = (State.t % 40) < 26;
  if (blink && State.t > 40) txt(g, 'ENTER', VW / 2, VH - 26, 10, '#ffe14f', 'center');
}
function drawClearCard(g) {
  g.fillStyle = 'rgba(6,10,14,0.82)'; g.fillRect(0, 0, VW, VH);
  const secs = Math.floor(Run.time / 60);
  bigTitle(g, L.idx === 2 ? 'GATE OPEN' : 'GRID CLEARED', VW / 2, 62, L.pal.lit);
  txt(g, 'TIME   ' + `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`, VW / 2, 116, 10, '#fff', 'center');
  txt(g, 'SHARDS ' + Run.total + ' / 100', VW / 2, 132, 10, '#ffe14f', 'center');
  txt(g, 'SQUISHED ' + Run.kills, VW / 2, 148, 10, 'rgba(255,255,255,0.8)', 'center');
  if (L.secretFound) txt(g, '★ every ice bell rang', VW / 2, 166, 9, '#8fdcff', 'center');
  const blink = (State.t % 44) < 30;
  if (blink && State.sub > 30) txt(g, 'ENTER', VW / 2, VH - 30, 11, '#ffe14f', 'center');
  PT.draw(g, { x: 0, y: 0 });
}
function drawPause(g) {
  g.fillStyle = 'rgba(6,10,14,0.72)'; g.fillRect(0, 0, VW, VH);
  bigTitle(g, 'PAUSED', VW / 2, 96, '#8ef0c8');
  txt(g, 'P  resume      R  restart level      M  mute', VW / 2, 150, 9, 'rgba(255,255,255,0.8)', 'center');
  if (boss) txt(g, 'tip: lure him into a fin, or land eight globs to jam his armour', VW / 2, 168, 8, '#ff9ec4', 'center');
}
function drawGameOver(g) {
  g.fillStyle = 'rgba(10,6,8,0.8)'; g.fillRect(0, 0, VW, VH);
  bigTitle(g, 'SYSTEM CRASH', VW / 2, 84, '#ff5470');
  txt(g, 'Slopio lost his shape', VW / 2, 130, 10, 'rgba(255,255,255,0.8)', 'center');
  const blink = (State.t % 44) < 30;
  if (blink) txt(g, 'ENTER  try again', VW / 2, 168, 11, '#ffe14f', 'center');
  PT.draw(g, { x: 0, y: 0 });
}

/* ------------------------------------------------------------- player --- */
function drawPlayer(g) {
  const P = Pl;
  if (P.dead && P.deadT > 40) return;
  const x = P.x - Cam.x, y = P.y - Cam.y;
  let alpha = 1;
  if (P.inv > 0 && !P.dead) { alpha = (P.inv % 8 < 4) ? 0.35 : 0.9; }
  const sq = P.sq, sx = 1 + sq, sy = 1 - sq * 0.85;
  // shadow
  g.fillStyle = 'rgba(0,0,0,0.22)';
  let gy = y; for (let k = 0; k < 26; k++) { if (T_SOLID.has(tileAtPx(P.x, y + k))) { gy = y + k; break; } }
  if (gy > y) { g.beginPath(); g.ellipse(x, gy, 7 * clamp(1 - (gy - y) / 90, 0.3, 1), 2.4, 0, 0, TAU); g.fill(); }
  const G = P.gel ? GEL[P.gel] : null;
  const face = P.dead ? 'hurt' : P.inv > 60 ? 'hurt' : P.onGround && Math.abs(P.vx) < 0.3
    ? (P.blink = (P.blink || 0) + 1, ((P.blink % 160) < 6 ? 'blink' : 'idle')) : 'idle';
  const o = { face, gel: P.gel, t: L.t + Run.time, alpha, wob: P.gliding ? 2 : 1,
    cracked: P.cracks > 0, glow: G ? G.col : (P.gelT > 0 ? '#fff' : null) };
  if (G) { o.tint = G.col; o.tintLite = G.lite; o.edge = '#12222c'; }
  if (P.gust) { for (let i = 0; i < 2; i++) PT.add({ x: P.x + rnd(-6, 6), y: P.y - 4, vx: rnd(-0.3, 0.3), vy: -1.6, col: 'rgba(190,220,255,0.5)', life: 16, sz: 2, g: -0.01 }); }
  g.save();
  if (P.face < 0) { g.translate(x, 0); g.scale(-1, 1); g.translate(-x, 0); }
  drawSlopio(g, x, y, sx, sy, o);
  g.restore();
  if (P.slam > 0) { g.fillStyle = 'rgba(200,255,235,0.25)'; g.fillRect(x - 6, y - 26, 12, 22); }
}

/* ---------------------------------------------------------- world view -- */
let vign = null;
function buildVignette() {
  const o = mkc(VW, VH);
  const grd = o.g.createRadialGradient(VW / 2, VH / 2, VH * 0.35, VW / 2, VH / 2, VH * 0.92);
  grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(0,0,0,0.55)');
  o.g.fillStyle = grd; o.g.fillRect(0, 0, VW, VH);
  vign = o.c;
}
function drawWorld(g) {
  drawBackdrop(g, L, Cam, L.t);
  drawTiles(g);
  drawEnts(g);
  if (boss) drawBoss(g);
  if (Haz.length) drawHaz(g);
  drawPlayer(g);
  PT.draw(g, Cam);
  drawFore(g, L, Cam, L.t);
  if (vign) { g.globalAlpha = 0.9; g.drawImage(vign, 0, 0); g.globalAlpha = 1; }
  // phase-3 thermal glitch
  if (boss && boss.alive && boss.phase >= 3) {
    g.fillStyle = 'rgba(255,40,40,0.05)'; g.fillRect(0, 0, VW, VH);
    if (L.t % 40 < 3) {
      for (let i = 0; i < 3; i++) { const yy = (Math.random() * VH) | 0, hh = 2 + (Math.random() * 6 | 0), off = (Math.random() * 6 - 3) | 0;
        const img = g.getImageData ? null : null; // slice copy handled in blit via canvas copy below
        g.fillStyle = 'rgba(255,80,80,0.10)'; g.fillRect(0, yy, VW, hh);
        g.fillStyle = 'rgba(90,200,255,0.08)'; g.fillRect(off, yy + hh, VW, 1);
      }
    }
  }
  if (State.hitStop > 0) { g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(0, 0, VW, VH); }
  if (L.t < 30) { g.fillStyle = `rgba(0,0,0,${1 - L.t / 30})`; g.fillRect(0, 0, VW, VH); }
  if (State.id === 'play' || State.id === 'pause' || State.id === 'clear' || State.id === 'gameover') drawHUD(g);
}

/* ============================================================ RENDER ==== */
function render() {
  B.setTransform(1, 0, 0, 1, 0, 0);
  B.globalAlpha = 1;
  B.clearRect(0, 0, VW, VH);
  const id = State.id;
  if (id === 'title') drawTitle(B);
  else if (id === 'cutscene') drawCutscene(B);
  else if (id === 'credits') drawCredits(B);
  else {
    drawWorld(B);
    if (id === 'intro') drawIntroCard(B);
    else if (id === 'clear') drawClearCard(B);
    else if (id === 'pause') drawPause(B);
    else if (id === 'gameover') drawGameOver(B);
  }
  blit();
}
let scale = 3;
function blit() {
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.imageSmoothingEnabled = false;
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.drawImage(buf, 0, 0, VW, VH, 0, 0, VW * scale, VH * scale);
}
function fit() {
  const ww = window.innerWidth, wh = window.innerHeight;
  scale = Math.max(1, Math.min(6, Math.floor(Math.min(ww / VW, wh / VH))));
  cv.style.width = (VW * scale) + 'px'; cv.style.height = (VH * scale) + 'px';
  cv.width = VW * scale; cv.height = VH * scale;
  cx.imageSmoothingEnabled = false;
}

/* ========================================================== MAIN LOOP === */
let lastT = 0, acc = 0;
function step() {
  State.update();
  for (const k in K.hit) K.hit[k] = false;
}
function frame(now) {
  if (!lastT) lastT = now;
  let dt = now - lastT; lastT = now;
  if (dt > 240) dt = 240;
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 5) { step(); acc -= STEP; }
  render();
  A.tick();
  requestAnimationFrame(frame);
}

/* ============================================================== BOOT ==== */
function boot() {
  buildSprites();
  buildVignette();
  fit();
  window.addEventListener('resize', fit);
  // a level must exist for the title screen background maths
  loadLevel(0, true);
  Cam.snap(Pl, L);
  Pl.x = L.spawnX; Pl.y = L.spawnY;
  State.set('title');
  requestAnimationFrame(frame);
}
try { boot(); } catch (err) {
  const d = document.getElementById('err');
  if (d) { d.textContent = 'Slopio melted: ' + (err && err.message ? err.message : err); d.style.display = 'block'; }
  throw err;
}
window.addEventListener('error', ev => {
  const d = document.getElementById('err');
  if (d && !d.textContent) { d.textContent = 'runtime error: ' + ev.message; d.style.display = 'block'; }
});

</script>
